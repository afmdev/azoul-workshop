<style>
  /* Palette follows the Azoul Gathering programme sheets: off-white, indigo, dashed orange rules. */
  :root {
    --karite: #f5f3ea;      /* page background: off-white paper */
    --coco: #ffffff;        /* lighter surface */
    --cacao: #2e2a6b;       /* indigo: headings, links, buttons */
    --tinta: #1d1c2b;       /* body text */
    --cacao-suave: #4a4870; /* secondary text */
    --bergamota: #a2540f;   /* accent text */
    --linea: #eeae6b;       /* dashed orange rules */
    --pomelo: #d9584f;      /* warnings */
    --vidrio: #2e2a6b;      /* jar */
    --oceano: #2e2a6b;

    --citricos: #f6c9a8;
    --florales: #d9d0ee;
    --amaderados: #dfc195;
    --frescos: #bfe3d6;

    --display: "Gelasio", Georgia, "Times New Roman", serif;
    --texto: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    --ancho: 68rem;
    --margen: clamp(1.25rem, 5vw, 3rem);
    --nav-alto: 3.75rem;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--karite);
    color: var(--tinta);
    font: 400 1.0625rem/1.6 var(--texto);
  }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; color: var(--cacao); }
  h1 { font-size: clamp(2.3rem, 6.8vw, 4.25rem); letter-spacing: -0.01em; line-height: 1.05; }
  h2 { font-size: clamp(2rem, 5.5vw, 3.1rem); }
  h3 { font-size: 1.5rem; }
  p { margin: 0; max-width: 62ch; text-wrap: pretty; }
  h1, h2, h3, p, li { overflow-wrap: break-word; }
  a { color: var(--bergamota); text-underline-offset: 0.2em; }
  :focus-visible { outline: 3px solid var(--bergamota); outline-offset: 3px; border-radius: 4px; }
  [id] { scroll-margin-top: calc(var(--nav-alto) + 1rem); }

  .contenedor { max-width: var(--ancho); margin-inline: auto; padding-inline: var(--margen); }
  .bloque { padding-block: clamp(3.5rem, 9vw, 7rem); }
  .entrada { color: var(--cacao-suave); font-size: 1.125rem; margin-top: 1rem; }

  .saltar { position: absolute; left: -999px; }
  .saltar:focus { left: 1rem; top: 1rem; z-index: 20; background: var(--coco); padding: 0.75rem 1rem; }

  /* ---------- Navigation ---------- */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--karite);
    border-bottom: 1px solid rgb(46 42 107 / 0.15);
  }
  .nav-fila {
    display: flex; align-items: center; gap: 1rem;
    min-height: var(--nav-alto);
  }
  .marca { font-family: var(--display); font-size: clamp(1rem, 4.2vw, 1.2rem); color: var(--cacao); text-decoration: none; white-space: nowrap; min-height: 44px; display: inline-flex; align-items: center; }
  .nav nav { min-width: 0; }
  /* Collab lockup: wordmark × name */
  .collab { white-space: nowrap; }
  .collab .x { font-family: var(--texto); font-weight: 400; font-size: 0.8em; margin-inline: 0.35em; color: var(--bergamota); }
  .collab em { font-style: italic; }
  /* Language switcher */
  .idioma { position: relative; }
  .idioma-boton {
    display: inline-flex; align-items: center; gap: 0.35rem; height: 44px; padding: 0 0.7rem;
    background: transparent; color: var(--cacao); border: 1px solid rgb(46 42 107 / 0.3); border-radius: 999px;
    font: 400 1.35rem/1 var(--texto); cursor: pointer;
  }
  .idioma-boton:hover { background: rgb(46 42 107 / 0.08); }
  .idioma-flecha { transition: transform 0.2s ease; }
  .idioma[data-abierto] .idioma-flecha { transform: rotate(180deg); }
  .idioma-menu {
    position: absolute; right: 0; top: calc(100% + 0.4rem); z-index: 20;
    margin: 0; padding: 0.35rem; list-style: none;
    background: var(--coco); border: 1px solid rgb(46 42 107 / 0.12); border-radius: 1rem;
    box-shadow: 0 14px 34px rgb(46 42 107 / 0.18);
    opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.98); transform-origin: top right;
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0.18s;
  }
  .idioma[data-abierto] .idioma-menu { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .idioma-menu button {
    display: flex; align-items: center; justify-content: center; width: 48px; height: 46px; padding: 0;
    background: none; border: 0; border-radius: 0.7rem; cursor: pointer;
    font: 400 1.5rem/1 var(--texto); color: var(--cacao);
  }
  .idioma-menu button:hover { background: rgb(46 42 107 / 0.07); }
  .idioma-menu button[aria-current] { background: rgb(46 42 107 / 0.14); box-shadow: inset 0 0 0 1.5px var(--cacao); }
  .nav nav ul {
    display: flex; gap: 0.25rem; list-style: none; margin: 0; padding: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .nav nav ul::-webkit-scrollbar { display: none; }
  .nav nav li a {
    display: inline-flex; align-items: center; min-height: 44px; padding-inline: 0.6rem;
    color: var(--cacao); text-decoration: none; white-space: nowrap; font-size: 0.9375rem; font-weight: 500;
    border-radius: 999px;
  }
  .nav nav li a:hover { background: rgb(46 42 107 / 0.08); }

  .menu { display: contents; }
  .menu-boton, .idioma-titulo { display: none; }
  /* Desktop: logo left, links centred, language right, all on one line */
  @media (min-width: 80rem) {
    .nav-fila { display: grid; grid-template-columns: 1fr auto 1fr; max-width: none; }
    .idioma { justify-self: end; }
  }

  /* Mobile: everything lives inside one hamburger panel */
  @media (max-width: 79.99rem) {
    .menu-boton {
      display: inline-flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
      width: 44px; height: 44px; margin-left: auto; margin-right: -0.6rem; padding: 0;
      background: none; border: 0; border-radius: 50%; cursor: pointer; color: var(--cacao);
    }
    .menu-boton span { display: block; width: 22px; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.25s ease, opacity 0.2s ease; }
    .nav[data-menu] .menu-boton span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav[data-menu] .menu-boton span:nth-child(2) { opacity: 0; }
    .nav[data-menu] .menu-boton span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .menu {
      display: block; position: absolute; left: 0; right: 0; top: 100%;
      max-height: calc(100dvh - var(--nav-alto)); overflow-y: auto; overscroll-behavior: contain;
      padding: 0.25rem var(--margen) 1.5rem;
      background: var(--karite); border-bottom: 1px solid rgb(46 42 107 / 0.15);
      box-shadow: 0 18px 30px rgb(46 42 107 / 0.14);
      opacity: 0; visibility: hidden; transform: translateY(-8px);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s 0.22s;
    }
    .nav[data-menu] .menu { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .nav nav { margin: 0; }
    .nav nav ul { display: block; overflow: visible; }
    .nav nav li a {
      display: flex; min-height: 52px; padding: 0; border-radius: 0;
      font: 400 1.45rem/1.1 var(--display); white-space: normal;
      border-bottom: 1px dashed var(--linea);
    }
    .nav nav li a:hover { background: none; color: var(--bergamota); }

    .idioma { margin: 1.25rem 0 0; }
    .idioma-titulo { display: block; font-size: 0.875rem; font-weight: 600; color: var(--cacao-suave); margin-bottom: 0.5rem; }
    .idioma-boton { display: none; }
    .idioma-menu {
      position: static; display: flex; gap: 0.5rem;
      min-width: 0; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none;
      opacity: 1; visibility: inherit; transform: none; transition: none;
    }
    .idioma-menu button { width: 56px; height: 48px; border: 1px solid rgb(46 42 107 / 0.25); border-radius: 999px; }
  }

  /* ---------- Hero: the jar label is the ingredient list ---------- */
  .hero { position: relative; overflow: hidden; }
  /* Hand-drawn flourishes: always decorative, always behind the content */
  .trazo { position: absolute; z-index: 0; color: var(--cacao); opacity: 0.5; pointer-events: none; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
  .trazo path { vector-effect: non-scaling-stroke; }
  .hero > .trazo { top: 0.2rem; right: -1rem; width: clamp(5.5rem, 20vw, 13rem); opacity: 1; }
  .bloque, footer { position: relative; overflow: hidden; }
  .bloque > .contenedor, footer > .contenedor { position: relative; z-index: 1; }
  .sin .trazo { color: var(--coco); }
  .hero .contenedor { position: relative; }
  .hero { padding-block: clamp(2.5rem, 7vw, 5rem) clamp(3.5rem, 9vw, 6rem); }
  .hero-rejilla { display: grid; gap: 3rem; align-items: center; }
  .hero p { font-size: 1.1875rem; margin-top: 1.5rem; color: var(--cacao-suave); max-width: 46ch; }
  .hero p.subtitulo { font-family: var(--display); font-size: clamp(1.6rem, 4.5vw, 2.4rem); line-height: 1.15; color: var(--bergamota); margin-top: 0.9rem; max-width: none; }
  .boton {
    display: inline-flex; align-items: center; min-height: 48px; margin-top: 2rem; padding: 0 1.5rem;
    background: var(--cacao); color: var(--coco); border-radius: 999px;
    font-weight: 600; text-decoration: none;
  }
  .boton:hover { background: var(--bergamota); }

  .tarro { width: min(100%, 23rem); margin-inline: auto; }
  .tapa {
    width: 88%; height: 3rem; margin-inline: auto;
    border-radius: 0.6rem 0.6rem 0.2rem 0.2rem;
    /* Gold screw lid: ribs over a soft metallic sheen */
    background:
      repeating-linear-gradient(90deg, transparent 0 7px, rgba(122, 84, 14, 0.35) 7px 9px),
      linear-gradient(90deg, #b8892b, #f0d684 28%, #d4a93f 55%, #f3dc93 72%, #a97a1f);
    box-shadow: inset 0 -3px 0 rgba(122, 84, 14, 0.35);
  }
  .cuerpo {
    /* Cobalt glass: vertical highlights left and right */
    background:
      linear-gradient(90deg, rgba(255,255,255,0.28) 0 3%, transparent 9%, transparent 90%, rgba(255,255,255,0.16) 96%, transparent),
      linear-gradient(180deg, #2f5fd0, #1c3f9e);
    border-radius: 1.1rem 1.1rem 2rem 2rem;
    padding: 1.5rem 0.9rem 2rem;
  }
  .etiqueta { background: var(--coco); border-radius: 0.3rem; padding: 1.25rem 1.1rem 1rem; }
  .etiqueta-marca { font-family: var(--display); font-size: 1.3rem; line-height: 1.1; color: var(--cacao); }
  .etiqueta-tipo { font-size: 0.875rem; color: var(--cacao-suave); margin-top: 0.15rem; }
  .etiqueta-listas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.75rem; margin-top: 0.9rem; border-top: 1px solid var(--cacao); padding-top: 0.6rem; }
  .etiqueta h2 { font-family: var(--texto); font-size: 0.8125rem; font-weight: 600; color: var(--cacao-suave); line-height: 1.6; }
  .etiqueta ul { list-style: none; margin: 0; padding: 0; }
  .etiqueta li a {
    display: flex; align-items: center; min-height: 44px;
    color: var(--cacao); text-decoration: none; font-size: 0.9375rem; line-height: 1.2;
    border-bottom: 1px dashed var(--linea);
    animation: aparecer 0.5s both; animation-delay: calc(var(--i) * 60ms + 200ms);
  }
  .etiqueta li a:hover { color: var(--bergamota); }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- How it works ---------- */
  .como { background: var(--coco); }
  .como-rejilla { display: grid; gap: 2rem; margin-top: 2.5rem; }
  .como-rejilla h3 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .como-rejilla p { color: var(--cacao-suave); }

  /* ---------- Function chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; padding: 0; margin: 0 0 0.9rem; }
  .chips li { border: 1px solid currentColor; border-radius: 999px; padding: 0.1rem 0.7rem; font-size: 0.875rem; font-weight: 500; }
  .inci { font-style: italic; color: var(--cacao-suave); font-size: 0.9375rem; }
  .origen { font-size: 0.9375rem; color: var(--cacao-suave); margin-top: 0.25rem; }
  .aviso {
    margin-top: 0.9rem; padding: 0.7rem 0.9rem; font-size: 0.9375rem;
    background: rgb(217 88 79 / 0.14); border-left: 3px solid var(--pomelo); border-radius: 0 0.3rem 0.3rem 0;
  }
  .aviso strong { font-weight: 600; }

  /* ---------- Base: five ingredients as material samples ---------- */
  .base-lista { list-style: none; margin: 2.5rem 0 0; padding: 0; }
  .base-item { display: grid; gap: 1rem 1.5rem; grid-template-columns: 3.5rem 1fr; padding-block: 2rem; border-top: 1px dashed var(--linea); }
  .muestra { width: 3.5rem; height: 3.5rem; border-radius: 50%; border: 1px solid rgb(46 42 107 / 0.25); }
  .base-item h3 { font-size: clamp(1.6rem, 4vw, 2.1rem); }
  .base-detalle { grid-column: 1 / -1; }

  /* ---------- Aromas: grouped by scent family ---------- */
  .familias { display: grid; gap: 1rem; margin-top: 2.5rem; }
  .familia { border-radius: 1.25rem; padding: 1.5rem 1.25rem 0.75rem; }
  .familia > p { font-size: 0.9375rem; margin: 0.35rem 0 0.75rem; }
  .familia details { border-top: 1px solid rgb(46 42 107 / 0.3); }
  .familia summary {
    display: flex; align-items: center; gap: 0.75rem; min-height: 56px; padding-block: 0.5rem;
    cursor: pointer; list-style: none;
  }
  .familia summary::-webkit-details-marker { display: none; }
  .familia summary .nombre { font-family: var(--display); color: var(--cacao); font-size: 1.4rem; line-height: 1.15; }
  .familia summary .notas { display: block; font-size: 0.875rem; }
  .familia summary::after {
    content: "+"; margin-left: auto; font-size: 1.6rem; line-height: 1; width: 1.5rem; text-align: center;
    transition: transform 0.2s;
  }
  .familia details[open] summary::after { transform: rotate(45deg); }
  .aroma-cuerpo { padding: 0.25rem 0 1.25rem; display: flow-root; }
  /* Botanical plates: multiply lets the white paper take the card's tint */
  .mini, .lamina { mix-blend-mode: multiply; height: auto; }
  .mini { width: 2.75rem; height: 3.25rem; object-fit: contain; flex: none; }
  .lamina { float: right; width: min(42%, 11rem); margin: 0 0 0.75rem 1rem; }
  .aroma-cuerpo .inci, .aroma-cuerpo .origen, .familia > p { color: var(--cacao); }
  .aroma-cuerpo p + p { margin-top: 0.6rem; }
  .aroma-cuerpo .chips { margin-top: 0.8rem; }

  /* ---------- Blends: drops per 30 ml jar ---------- */
  .mezclas { display: grid; gap: 1rem; margin-top: 2.5rem; }
  .mezcla { background: var(--coco); border-radius: 1.25rem; padding: 1.5rem 1.25rem 1rem; }
  .mezcla > p { font-size: 0.9375rem; color: var(--cacao-suave); margin-top: 0.35rem; }
  .mezcla ul { list-style: none; margin: 1rem 0 0; padding: 0; }
  .mezcla li a {
    display: flex; align-items: center; gap: 0.6rem; min-height: 44px;
    color: var(--cacao); text-decoration: none; border-top: 1px dashed var(--linea);
  }
  .mezcla li a:hover { color: var(--bergamota); }
  .mezcla .punto { width: 0.8rem; height: 0.8rem; border-radius: 50%; border: 1px solid rgb(46 42 107 / 0.3); flex: none; }
  .mezcla .gotas { margin-left: auto; font-family: var(--display); font-size: 1.2rem; white-space: nowrap; }
  .mezcla .total { font-size: 0.875rem; color: var(--cacao-suave); padding-top: 0.6rem; border-top: 1px solid var(--cacao); margin-top: 0; }
  .nota-mezclas { max-width: none; margin-top: 1.5rem; font-size: 0.9375rem; color: var(--cacao-suave); }

  /* Smooth open/close for every <details>, CSS only.
     Browsers without interpolate-size / ::details-content just open instantly. */
  :root { interpolate-size: allow-keywords; }
  details::details-content {
    /* No opacity fade here: opacity < 1 isolates the group, so the multiply-blended
       plates would show their white paper until the transition ends. */
    block-size: 0; overflow: clip;
    transition: block-size 0.35s ease, content-visibility 0.35s allow-discrete;
  }
  details[open]::details-content { block-size: auto; }

  /* ---------- What it leaves out ---------- */
  .sin { background: var(--oceano); color: var(--coco); position: relative; }
  .sin h2 { color: var(--coco); }
  .ola { display: block; width: 100%; height: 2rem; color: var(--oceano); margin-bottom: -1px; }
  .sin ul { list-style: none; margin: 2rem 0 0; padding: 0; }
  .sin li { font-family: var(--display); font-size: clamp(2rem, 8vw, 4.5rem); line-height: 1.15; }
  .sin s { text-decoration-color: var(--linea); text-decoration-thickness: 0.09em; }
  .sin p { margin-top: 2rem; color: #e4e2f3; }

  /* ---------- Process (a real sequence, so it is numbered) ---------- */
  .pasos { margin: 2.5rem 0 0; padding: 0; list-style: none; counter-reset: paso; display: grid; gap: 1.75rem; }
  .pasos li { counter-increment: paso; display: grid; grid-template-columns: 2.75rem 1fr; gap: 0 0.75rem; }
  .pasos li::before { content: counter(paso); font-family: var(--display); font-size: 2.5rem; line-height: 1; color: var(--bergamota); }
  .pasos h3 { font-size: 1.35rem; margin-bottom: 0.3rem; }
  .pasos p { color: var(--cacao-suave); }

  /* ---------- FAQ ---------- */
  .faq { background: var(--coco); }
  .faq-lista { margin-top: 2rem; max-width: 46rem; }
  .faq details { border-bottom: 1px dashed var(--linea); }
  .faq summary {
    display: flex; align-items: center; gap: 1rem; min-height: 56px; padding-block: 0.75rem;
    cursor: pointer; font-weight: 600; list-style: none;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; margin-left: auto; font-size: 1.5rem; line-height: 1; transition: transform 0.2s; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { padding-bottom: 1.25rem; color: var(--cacao-suave); }
  .receta ul { list-style: none; margin: 0 0 1.25rem; padding: 0; border-top: 1px dashed var(--linea); }
  .receta li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px dashed var(--linea); }
  .receta li span:last-child { font-family: var(--display); font-size: 1.15rem; color: var(--cacao); white-space: nowrap; }

  /* ---------- Footer ---------- */
  footer { padding-block: 3.5rem; }
  .pie-rejilla { display: grid; gap: 2.5rem; }

// ---------- Rendering ----------
const el = (id) => document.getElementById(id);
const base = INGREDIENTES.filter((i) => i.tipo === "base");
const aromas = INGREDIENTES.filter((i) => i.tipo === "aroma");
const porId = Object.fromEntries(INGREDIENTES.map((i) => [i.id, i]));
const marca = `${CONFIG.marca}<span class="x">×</span><em>${CONFIG.colaborador}</em>`;

// Self-check: every locale covers every ingredient and blend; no blend is over-dosed.
for (const [k, t] of Object.entries(L)) {
  console.assert(INGREDIENTES.every((i) => t.ing[i.id] && i.fn.every((f) => t.fn[f])), "Missing ingredient text: " + k);
  console.assert(t.mez.length === MEZCLAS.length && t.faq.length === L.en.faq.length, "Missing blends/FAQ: " + k);
}
console.assert(RECETA.reduce((s, [, n]) => s + n, ACEITES_G) === 100, "Recipe must add up to 100 g");
MEZCLAS.forEach((m, n) => console.assert(m.reduce((s, [, g]) => s + g, 0) <= 12 && m.every(([id]) => porId[id]), "Check blend " + n));

function render(lang) {
  const t = L[lang], ui = t.ui;
  const chips = (i) => `<ul class="chips">${i.fn.map((f) => `<li>${t.fn[f]}</li>`).join("")}</ul>`;
  const aviso = (x) => (x.a ? `<p class="aviso"><strong>${ui.warn}</strong> ${x.a}</p>` : "");

  document.documentElement.lang = lang;
  document.querySelector('meta[name="description"]').content = ui.desc;
  document.querySelectorAll("[data-t]").forEach((n) => (n.textContent = ui[n.dataset.t]));
  document.querySelectorAll("[data-marca]").forEach((n) => { n.classList.add("collab"); n.innerHTML = marca; });
  el("nav-secciones").setAttribute("aria-label", ui.menu);
  el("menu-boton").setAttribute("aria-label", ui.menu);

  const enlace = (i, n) => `<li><a href="#${i.id}" style="--i:${n}">${t.ing[i.id].n}</a></li>`;
  el("etiqueta-base").innerHTML = base.map(enlace).join("");
  el("etiqueta-aromas").innerHTML = aromas.map((i, n) => enlace(i, n + base.length)).join("");

  el("lista-base").innerHTML = base.map((i) => { const x = t.ing[i.id]; return `
    <li class="base-item" id="${i.id}">
      <div class="muestra" style="background:${i.color}${FOTOS.has(i.id) ? ` url(img/base-${i.id}.webp) center/cover` : ""}" aria-hidden="true"></div>
      <div>
        <h3>${x.n}</h3>
        <p class="inci" lang="la">${i.inci}</p>
        <p class="origen">${x.o}</p>
      </div>
      <div class="base-detalle">
        ${chips(i)}
        <p>${x.t}</p>
        ${aviso(x)}
      </div>
    </li>`; }).join("");

  el("lista-aromas").innerHTML = FAMILIAS.map((f) => `
    <div class="familia" style="background:var(--${f})">
      <h3>${t.fam[f][0]}</h3>
      <p>${t.fam[f][1]}</p>
      ${aromas.filter((i) => i.familia === f).map((i) => { const x = t.ing[i.id]; return `
        <details name="aroma" id="${i.id}">
          <summary><img class="mini" src="img/${i.id}.webp" alt="" width="${LAMINAS[i.id][0]}" height="${LAMINAS[i.id][1]}" loading="lazy"><span><span class="nombre">${x.n}</span><span class="notas">${x.nt}</span></span></summary>
          <div class="aroma-cuerpo">
            <img class="lamina" src="img/${i.id}.webp" alt="${x.n}" width="${LAMINAS[i.id][0]}" height="${LAMINAS[i.id][1]}" loading="lazy">
            <p>${x.t}</p>
            <p><strong>${ui.odour}</strong> ${x.p}</p>
            <p class="origen">${x.o}</p>
            <p class="inci" lang="la">${i.inci}</p>
            ${chips(i)}
            ${aviso(x)}
          </div>
        </details>`; }).join("")}
    </div>`).join("");

  el("lista-mezclas").innerHTML = MEZCLAS.map((m, n) => {
    const total = m.reduce((s, [, g]) => s + g, 0);
    return `
    <article class="mezcla">
      <h3>${t.mez[n][0]}</h3>
      <p>${t.mez[n][1]}</p>
      <ul>${m.map(([id, g]) => `
        <li><a href="#${id}"><span class="punto" style="background:var(--${porId[id].familia})"></span>${t.ing[id].n}<span class="gotas">${g} ${g === 1 ? ui.drop : ui.drops}</span></a></li>`).join("")}
      </ul>
      <p class="total">${ui.total.replace("{n}", total)}</p>
    </article>`;
  }).join("");

  el("lista-sin").innerHTML = t.sin.map((s) => `<li><s>${s}</s></li>`).join("");
  el("lista-pasos").innerHTML = t.pasos.map(([h, p]) => `<li><div><h3>${h}</h3><p>${p}</p></div></li>`).join("");
  const g = (n) => n.toLocaleString(lang) + " g";
  const receta = `<details><summary>${ui.recipeQ}</summary><div class="receta"><p>${ui.recipeP}</p>
    <ul>${RECETA.map(([id, n]) => `<li><span>${t.ing[id].n}</span><span>${g(n)}</span></li>`).join("")}
      <li><span>${ui.eo}</span><span>${g(ACEITES_G)}</span></li></ul>
    <p>${ui.recipeNote}</p></div></details>`;
  el("lista-faq").innerHTML = receta + t.faq.map(([p, r]) => `<details><summary>${p}</summary><p>${r}</p></details>`).join("");
  el("inci-completo").textContent = INGREDIENTES.map((i) => i.inci).join(", ") + ".";
  el("pie-autor").innerHTML = `<p>${ui.byTop}</p><p class="pie-marca collab">${marca}</p><p>${ui.byPlace}</p><p class="corazon" aria-hidden="true">❤️</p>`;

  // Language switcher state
  el("idioma-actual").textContent = BANDERAS[lang];
  el("idioma-boton").setAttribute("aria-label", `${ui.lang}: ${IDIOMAS[lang]}`);
  el("idioma-menu").innerHTML = Object.entries(IDIOMAS).map(([k, nombre]) =>
    `<li><button type="button" data-lang="${k}" aria-label="${nombre}" title="${nombre}"${k === lang ? ' aria-current="true"' : ""}>${BANDERAS[k]}</button></li>`).join("");
}

// ---------- Language: ?lang= > saved choice > browser language > English ----------
const guardado = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })();
const candidatos = [new URLSearchParams(location.search).get("lang"), guardado, ...(navigator.languages || []).map((l) => l.slice(0, 2))];
let idioma = candidatos.find((l) => L[l]) || "en";
render(idioma);

const caja = el("idioma"), boton = el("idioma-boton");
const abrir = (si) => { caja.toggleAttribute("data-abierto", si); boton.setAttribute("aria-expanded", si); };
boton.addEventListener("click", () => abrir(!caja.hasAttribute("data-abierto")));
document.addEventListener("click", (e) => { if (!caja.contains(e.target)) abrir(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && caja.hasAttribute("data-abierto")) { abrir(false); boton.focus(); } });
el("idioma-menu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-lang]");
  if (!b) return;
  idioma = b.dataset.lang;
  try { localStorage.setItem("lang", idioma); } catch {}
  render(idioma);
  abrir(false);
  menu(false);
});

  ["#proceso", "onda", "top:1.5rem;right:-4rem;width:clamp(9rem,32vw,19rem);transform:scaleX(-1)"],
  ["#proceso", "lazo", "bottom:1rem;left:-2rem;width:clamp(7rem,22vw,13rem)"],
  ["#faq", "ovalo", "top:2rem;right:4%;width:clamp(5rem,15vw,9rem);transform:rotate(-10deg)"],
  ["#faq", "triple", "bottom:1rem;right:-3rem;width:clamp(8rem,26vw,15rem);transform:rotate(6deg)"],
  ["footer", "curva", "top:0.75rem;right:-3rem;width:clamp(10rem,32vw,19rem)"],
];
for (const [sel, forma, css] of TRAZOS) {
  const [vb, d] = FORMAS[forma];
  document.querySelector(sel).insertAdjacentHTML("afterbegin", `<svg class="trazo" style="${css}" viewBox="${vb}" aria-hidden="true"><path d="${d}"/></svg>`);
}

// Mobile menu
const cabecera = document.querySelector(".nav"), menuBoton = el("menu-boton");
function menu(si) { cabecera.toggleAttribute("data-menu", si); menuBoton.setAttribute("aria-expanded", si); }
menuBoton.addEventListener("click", () => menu(!cabecera.hasAttribute("data-menu")));
el("nav-secciones").addEventListener("click", (e) => { if (e.target.closest("a")) menu(false); });
document.addEventListener("click", (e) => { if (!cabecera.contains(e.target)) menu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && cabecera.hasAttribute("data-menu")) { menu(false); menuBoton.focus(); } });

// Jar label links to an aroma: open its panel so the anchor lands on visible content.
const abrirDesdeHash = () => {
  const d = document.getElementById(location.hash.slice(1));
  if (d && d.tagName === "DETAILS") { d.open = true; d.scrollIntoView(); }
};
addEventListener("hashchange", abrirDesdeHash);
abrirDesdeHash();
</script>
</body>
</html>
