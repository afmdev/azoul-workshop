    - generic [ref=f1e83]:
      - heading "Deodorant, not antiperspirant" [level=2] [ref=f1e84]
      - paragraph [ref=f1e85]: An antiperspirant plugs the pore so you don't sweat. This deodorant lets you sweat, which is what the body needs, and takes care of what comes next.
      - generic [ref=f1e86]:
        - generic [ref=f1e87]:
          - heading "Sweat has no smell" [level=3] [ref=f1e88]
          - paragraph [ref=f1e89]: Odour appears when skin bacteria break down sweat. Baking soda helps neutralise those compounds.
        - generic [ref=f1e90]:
          - heading "Absorb instead of block" [level=3] [ref=f1e91]
          - paragraph [ref=f1e92]: Cornstarch takes up some of the moisture and leaves the underarm feeling dry, without closing the pore.
        - generic [ref=f1e93]:
          - heading "Care for the skin" [level=3] [ref=f1e94]
          - paragraph [ref=f1e95]: Shea butter, cocoa butter and coconut oil make the cream glide and leave the skin soft.
    - generic [ref=f1e97]:
      - heading "The base" [level=2] [ref=f1e98]
      - paragraph [ref=f1e99]: "Six ingredients do the work: three plant fats that give body and care for the skin, and three powders that deal with moisture and odour."
      - list [ref=f1e100]:
        - listitem [ref=f1e101]:
          - generic [ref=f1e103]:
            - heading "Shea butter" [level=3] [ref=f1e104]
            - paragraph [ref=f1e105]: Butyrospermum Parkii Butter
            - paragraph [ref=f1e106]: Nut of the shea tree, from West Africa.
          - generic [ref=f1e107]:
            - list [ref=f1e108]:
              - listitem [ref=f1e109]: Softens the skin
              - listitem [ref=f1e110]: Gives texture
            - paragraph [ref=f1e111]: This is the butter that lets the cream glide without tugging at the skin. Rich in fatty acids, it helps keep the underarm moisturised, which is especially welcome after shaving.
        - listitem [ref=f1e112]:
          - generic [ref=f1e114]:
            - heading "Coconut oil" [level=3] [ref=f1e115]
            - paragraph [ref=f1e116]: Cocos Nucifera Oil
            - paragraph [ref=f1e117]: Flesh of the coconut.
          - generic [ref=f1e118]:
            - list [ref=f1e119]:
              - listitem [ref=f1e120]: Gives texture
              - listitem [ref=f1e121]: Softens the skin
              - listitem [ref=f1e122]: Helps against odour
            - paragraph [ref=f1e123]: Solid when cool and liquid at body temperature, which is why the cream melts as you apply it. It contains lauric acid, studied for its activity against the bacteria that cause odour.
        - listitem [ref=f1e124]:
          - generic [ref=f1e126]:
            - heading "Cocoa butter" [level=3] [ref=f1e127]
            - paragraph [ref=f1e128]: Theobroma Cacao Seed Butter
