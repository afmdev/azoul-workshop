              - listitem [ref=f1e165]: Helps against odour
              - listitem [ref=f1e166]: Protects the skin
            - paragraph [ref=f1e167]: The same mineral used in nappy creams. It helps reduce odour and has long been used to protect the skin and soothe it when irritated.
            - paragraph [ref=f1e168]:
