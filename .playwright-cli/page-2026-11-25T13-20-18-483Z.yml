          - generic [ref=f1e130]:
            - list [ref=f1e131]:
              - listitem [ref=f1e132]: Adds firmness
              - listitem [ref=f1e133]: Softens the skin
            - paragraph [ref=f1e134]: "The hardest of the three fats: it gives the formula body so it holds up better in the heat. It leaves a thin layer that protects the skin and a very faint scent of chocolate."
        - listitem [ref=f1e135]:
          - generic [ref=f1e137]:
            - heading "Cornstarch" [level=3] [ref=f1e138]
            - paragraph [ref=f1e139]: Zea Mays Starch
            - paragraph [ref=f1e140]: Ground maize kernels.
          - generic [ref=f1e141]:
            - list [ref=f1e142]:
              - listitem [ref=f1e143]: Absorbs moisture
            - paragraph [ref=f1e144]: "It doesn't stop sweat: it absorbs it. It does the job talc used to do, leaves a dry, silky feel and takes away the greasy touch of the butters."
        - listitem [ref=f1e145]:
          - generic [ref=f1e147]:
            - heading "Baking soda" [level=3] [ref=f1e148]
            - paragraph [ref=f1e149]: Sodium Bicarbonate
            - paragraph [ref=f1e150]: Mineral salt.
          - generic [ref=f1e151]:
            - list [ref=f1e152]:
              - listitem [ref=f1e153]: Neutralises odour
            - paragraph [ref=f1e154]: This is the ingredient that deals with odour. It is alkaline and neutralises the acidic compounds bacteria produce when they break down sweat.
            - paragraph [ref=f1e155]:
              - strong [ref=f1e156]: "Keep in mind:"
              - text: It can irritate sensitive skin. If you notice redness or itching, stop using it.
        - listitem [ref=f1e157]:
