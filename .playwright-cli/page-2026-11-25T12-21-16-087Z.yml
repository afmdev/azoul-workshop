    - generic [ref=e83]:
      - heading "Desodorante, no antitranspirante" [level=2] [ref=e84]
      - paragraph [ref=e85]: Un antitranspirante tapona el poro para que no sudes. Este desodorante te deja sudar, que es lo que el cuerpo necesita, y se ocupa de lo que viene después.
