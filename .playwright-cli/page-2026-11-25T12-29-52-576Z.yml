    - generic [ref=f2e83]:
      - heading "Deo, kein Antitranspirant" [level=2] [ref=f2e84]
      - paragraph [ref=f2e85]: Ein Antitranspirant verschließt die Poren, damit du nicht schwitzt. Dieses Deo lässt dich schwitzen – das braucht der Körper – und kümmert sich um das, was danach kommt.
      - generic [ref=f2e86]:
        - generic [ref=f2e87]:
          - heading "Schweiß riecht nicht" [level=3] [ref=f2e88]
          - paragraph [ref=f2e89]: Geruch entsteht, wenn Hautbakterien den Schweiß abbauen. Natron hilft, diese Verbindungen zu neutralisieren.
        - generic [ref=f2e90]:
          - heading "Aufnehmen statt blockieren" [level=3] [ref=f2e91]
          - paragraph [ref=f2e92]: Maisstärke nimmt einen Teil der Feuchtigkeit auf und hinterlässt ein trockenes Gefühl, ohne die Poren zu verschließen.
        - generic [ref=f2e93]:
          - heading "Die Haut pflegen" [level=3] [ref=f2e94]
          - paragraph [ref=f2e95]: Sheabutter, Kakaobutter und Kokosöl sorgen dafür, dass die Creme gleitet und die Haut weich bleibt.
