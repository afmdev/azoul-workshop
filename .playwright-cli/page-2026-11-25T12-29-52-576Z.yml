              - listitem [ref=f2e122]: Hilft gegen Geruch
            - paragraph [ref=f2e123]: Fest, wenn es kühl ist, und flüssig bei Körperwärme – deshalb schmilzt die Creme beim Auftragen. Es enthält Laurinsäure, die auf ihre Wirkung gegen geruchsbildende Bakterien untersucht wurde.
        - listitem [ref=f2e124]:
