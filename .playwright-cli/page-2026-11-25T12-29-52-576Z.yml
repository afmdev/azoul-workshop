          - generic [ref=f2e151]:
            - list [ref=f2e152]:
              - listitem [ref=f2e153]: Neutralisiert Geruch
            - paragraph [ref=f2e154]: Diese Zutat kümmert sich um den Geruch. Natron ist basisch und neutralisiert die sauren Verbindungen, die Bakterien beim Abbau von Schweiß bilden.
            - paragraph [ref=f2e155]:
              - strong [ref=f2e156]: "Gut zu wissen:"
              - text: Kann empfindliche Haut reizen. Bei Rötung oder Juckreiz nicht weiter verwenden.
        - listitem [ref=f2e157]:
