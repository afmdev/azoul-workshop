      - paragraph [ref=f2e99]: "Sechs Zutaten machen die Arbeit: drei Pflanzenfette, die Konsistenz geben und die Haut pflegen, und drei Pulver, die sich um Feuchtigkeit und Geruch kümmern."
      - list [ref=f2e100]:
