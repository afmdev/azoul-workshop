              - listitem [ref=f2e110]: Gibt Textur
            - paragraph [ref=f2e111]: Diese Butter sorgt dafür, dass sich die Creme verteilen lässt, ohne an der Haut zu ziehen. Sie ist reich an Fettsäuren und hilft, die Achsel geschmeidig zu halten – besonders angenehm nach dem Rasieren.
        - listitem [ref=f2e112]:
