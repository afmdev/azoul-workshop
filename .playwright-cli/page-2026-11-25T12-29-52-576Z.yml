            - heading "Zinkoxid" [level=3] [ref=f2e160]
            - paragraph [ref=f2e161]: Zinc Oxide
            - paragraph [ref=f2e162]: Weißes Mineralpulver.
          - generic [ref=f2e163]:
            - list [ref=f2e164]:
              - listitem [ref=f2e165]: Hilft gegen Geruch
              - listitem [ref=f2e166]: Schützt die Haut
            - paragraph [ref=f2e167]: Dasselbe Mineral wie in Wundschutzcremes für Babys. Es hilft, Geruch zu verringern, und wird seit Langem verwendet, um die Haut zu schützen und bei Reizungen zu beruhigen.
            - paragraph [ref=f2e168]:
              - strong [ref=f2e169]: "Gut zu wissen:"
              - text: Zu viel davon kann weiße Spuren hinterlassen.
