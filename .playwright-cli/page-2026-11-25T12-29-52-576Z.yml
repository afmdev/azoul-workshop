            - paragraph [ref=f2e134]: "Das härteste der drei Fette: Es gibt der Rezeptur Festigkeit, damit sie Wärme besser standhält. Es hinterlässt einen dünnen, schützenden Film und einen ganz leichten Schokoladenduft."
