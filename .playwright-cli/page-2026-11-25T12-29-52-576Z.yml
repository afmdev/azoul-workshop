            - paragraph [ref=f2e144]: Sie stoppt den Schweiß nicht, sie nimmt ihn auf. Sie übernimmt die Aufgabe, die früher Talkum hatte, hinterlässt ein trockenes, seidiges Gefühl und nimmt den Buttern das Fettige.
        - listitem [ref=f2e145]:
